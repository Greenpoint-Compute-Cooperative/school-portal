name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: CSP hashes match the inline blocks; vendored imports resolve; no network dependency
        run: node scripts/check-release.mjs
      - name: index.html parses and references only files that exist
        run: |
          python3 - <<'PY'
          import html.parser, pathlib, re, sys
          root = pathlib.Path('.'); src = (root/'index.html').read_text()
          class P(html.parser.HTMLParser):
              refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  for k in ('src', 'href'):
                      v = a.get(k)
                      if v and not v.startswith(('http', '#', 'mailto:', 'data:')): self.refs.append(v)
          p = P(); p.feed(src)
          for m in re.finditer(r'"(\./public/[^"]+)"', src): p.refs.append(m.group(1))
          missing = [r for r in p.refs if not (root / r.lstrip('./')).exists() and not r.endswith('/')]
          print(f"{len(p.refs)} local references, {len(missing)} missing"); sys.exit(1 if missing else 0)
          PY
  secret-scan:
    uses: Greenpoint-Compute-Cooperative/.github/.github/workflows/secret-scan.yml@main
